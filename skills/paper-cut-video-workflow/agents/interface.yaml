interface:
  display_name: "Paper-Cut Video Workflow"
  short_description: "从产品简报到剪纸风短视频质检交付的完整工作流"
  default_prompt: "帮我做一个剪纸风格短视频，从产品简报、脚本、分镜、关键帧、旁白、配乐、合成到最终质检交付。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "codex"
    - "claude-code"
    - "trae"
    - "cursor"
    - "generic"
  activation:
    mode: "automatic-or-manual"
    paths: []
  execution:
    context: "local-project"
    shell: "portable"
  trust:
    source_tier: "public"
    private-media-policy: "project-only"
  degradation:
    media-tools-unavailable: "produce production-ready specifications and placeholders"
